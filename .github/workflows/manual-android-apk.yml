name: Manual Android APK Build

run-name: Build FirePulse APK (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        type: choice
        options:
          - debug
        default: debug

permissions:
  contents: read

concurrency:
  group: firepulse-manual-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile Android app and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Compile standalone debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK for download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/FirePulse-debug.apk
          sha256sum release/FirePulse-debug.apk | tee release/SHA256SUMS.txt

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: FirePulse-debug-apk
          path: |
            release/FirePulse-debug.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3
